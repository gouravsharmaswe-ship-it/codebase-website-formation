databases:
  - name: synapse-db
    databaseName: synapse
    user: synapse
    plan: free

services:
  - type: web
    name: synapse-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
