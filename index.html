<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gourav — Personal Profile</title>
  <meta name="description" content="Personal profile card for Gourav, First-year B.Tech CSE student at IIIT Kota.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- =========================================================================
       THEME CONTROLS
       ========================================================================= -->
  <header class="page-header">
    <button 
      type="button" 
      id="themeToggle" 
      class="theme-toggle" 
      aria-label="Switch to light theme"
      aria-pressed="false"
    >
      <!-- Sun Icon (shown in dark theme) -->
      <svg class="theme-icon icon-sun" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
      </svg>
      <!-- Moon Icon (shown in light theme) -->
      <svg class="theme-icon icon-moon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
      </svg>
      <span class="theme-label" id="themeStatus">Light mode</span>
    </button>
  </header>

  <!-- =========================================================================
       MAIN PROFILE CARD
       Edit personal details in the section below.
       ========================================================================= -->
  <main class="card-stage">
    
    <div class="card-wrapper" id="cardWrapper">
      <!-- Ambient pointer-tracking glow behind card -->
      <div class="card-glow" aria-hidden="true"></div>

      <article class="profile-card" id="profileCard">
        
        <!-- Header: Profile Image with Graceful Fallback -->
        <div class="card-header">
          <div class="avatar-frame">
            <!-- 
              EDIT PROFILE IMAGE:
              Replace "assets/avatar.jpg" with your image URL or local path.
              If left blank or if loading fails, the monogram fallback automatically appears.
            -->
            <img 
              src="assets/avatar.jpg" 
              alt="Portrait of Gourav" 
              class="avatar-image" 
              id="avatarImage"
              width="96" 
              height="96"
              loading="eager"
            >
            <!-- Fallback monogram shown if image fails to load -->
            <div class="avatar-fallback" id="avatarFallback" aria-hidden="true">G</div>
          </div>

          <div class="status-indicator" title="Active student">
            <span class="status-dot"></span>
            <span class="status-text">Available to connect</span>
          </div>
        </div>

        <!-- Identity & Details -->
        <div class="card-body">
          
          <!-- Name -->
          <h1 class="profile-name">Gourav</h1>

          <!-- Headline -->
          <p class="profile-headline">
            First-year B.Tech CSE student at IIIT Kota
          </p>

          <!-- Core Interests: Web Dev & DSA -->
          <div class="profile-interests">
            <span class="interest-label">Focus</span>
            <p class="interest-text">
              Web development and data structures &amp; algorithms
            </p>
          </div>

          <!-- Location -->
          <div class="profile-meta">
            <svg class="meta-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M8 1a5 5 0 00-5 5c0 3.492 4.416 8.527 4.605 8.741a.524.524 0 00.79 0C8.584 14.527 13 9.492 13 6a5 5 0 00-5-5zm0 7.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z" clip-rule="evenodd" />
            </svg>
            <span class="location-name">Narnaul, India</span>
          </div>

        </div>

        <!-- Actions & Links -->
        <footer class="card-footer">
          
          <!-- 
            PRIMARY LINK:
            Replace the href with your portfolio URL or contact link.
          -->
          <a href="mailto:gourav@example.com" class="primary-btn">
            <span>Get in touch</span>
            <svg class="btn-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 8h10M9 4l4 4-4 4" />
            </svg>
          </a>

          <!-- 
            SOCIAL LINKS:
            Replace href values with your own profiles.
          -->
          <nav class="social-nav" aria-label="Social links">
            <!-- GitHub -->
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0016 8c0-4.42-3.58-8-8-8z" clip-rule="evenodd" />
              </svg>
            </a>

            <!-- LinkedIn -->
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"/>
              </svg>
            </a>

            <!-- Email -->
            <a href="mailto:gourav@example.com" class="social-link" aria-label="Email Gourav">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M0 4a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H2a2 2 0 01-2-2V4zm2-1a1 1 0 00-1 1v.217l7 4.2 7-4.2V4a1 1 0 00-1-1H2zm13 2.383l-4.708 2.825L15 11.105V5.383zm-.034 6.876l-5.64-4.23-1.326.795-1.326-.795-5.64 4.23A1 1 0 002 13h12a1 1 0 00.966-.741zM1 11.105l4.708-2.897L1 5.383v5.722z"/>
              </svg>
            </a>
          </nav>

        </footer>

      </article>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
